name: Clean up MyConty migration helper

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/cleanup-myconty-migration.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove temporary migration workflows
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/import-myconty-share.yml
          git rm -f .github/workflows/cleanup-myconty-migration.yml
          git commit -m 'Remove temporary migration workflows [skip ci]'
          git push origin HEAD:master
