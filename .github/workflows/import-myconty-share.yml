name: Import MyConty share assets

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/import-myconty-share.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download exported share artifact
        env:
          ASSET_URL: 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-7e0c-81f7-836f-f2a800692296/raw?se=2026-09-01T05%3A45%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=d9b87ded-7b97-512b-b4fb-567b4a8df852&skoid=732f244e-db13-47c3-bcc7-7ee02a9397bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T21%3A20%3A07Z&ske=2026-09-01T21%3A20%3A07Z&sks=b&skv=2026-02-06&sig=92UxlVaR4zGQglJsZhgbjmRAzmyYACDAkU7vlvRcofQ%3D'
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ASSET_URL" -o /tmp/myconty-share.zip
          rm -rf /tmp/myconty-share
          mkdir -p /tmp/myconty-share
          unzip -q /tmp/myconty-share.zip -d /tmp/myconty-share

      - name: Verify source blobs
        run: |
          set -euo pipefail
          cd /tmp/myconty-share
          cat > /tmp/expected-blobs.txt <<'EOF'
          3af81dbc4f19cc0f9b20ab94674233f0cf6f3491  fonts/monolisa/MonoLisa-Black.ttf
          393847d4bc947cce49e0cab4831531ba5c70be03  fonts/monolisa/MonoLisa-BlackItalic.ttf
          30cde76d3acdee6432b7bf7000417439ebe0928b  fonts/monolisa/MonoLisa-Bold.ttf
          ba50e7099270ccaedb072432e0383043d6a0ddf7  fonts/monolisa/MonoLisa-BoldItalic.ttf
          0f30ec0be2a08bab41118ad6470450c630a4390d  fonts/monolisa/MonoLisa-ExtraBold.ttf
          cda86585076727f77e668241989a469a2e062fd0  fonts/monolisa/MonoLisa-ExtraBoldItalic.ttf
          63c19b83a7ffb0687b976bd0615eaba0067679b5  fonts/monolisa/MonoLisa-ExtraLight.ttf
          018c63669236b0b62d6001306f667d398955a3af  fonts/monolisa/MonoLisa-ExtraLightItalic.ttf
          59f0fb20eeea3cb26cdd3e441629a74ccc4b8491  fonts/monolisa/MonoLisa-Light.ttf
          10ef0eec27918168ae95417461050cfe74d2722a  fonts/monolisa/MonoLisa-LightItalic.ttf
          254af7d4faf1dcc257f99370a1b305318614872b  fonts/monolisa/MonoLisa-Medium.ttf
          857565c755b92c0c539bb0196d1eed5534923208  fonts/monolisa/MonoLisa-MediumItalic.ttf
          3e0c9c3c19be6edc93b9bd6416da23033b24d080  fonts/monolisa/MonoLisa-Regular.ttf
          2931ccc236fc22b55859c32d62e904f21d0ed3d0  fonts/monolisa/MonoLisa-RegularItalic.ttf
          5df3812ec2fc60daad269a94e1e57cb218515ac9  fonts/monolisa/MonoLisa-SemiBold.ttf
          cead9cf3ce558f9d3057cde45c8fda6e31c27838  fonts/monolisa/MonoLisa-SemiBoldItalic.ttf
          baa618055de8b8953f261f2be634d16ed67d18b8  fonts/monolisa/MonoLisa-Thin.ttf
          e9e4b0596abd79499c7b1be956d1b0cb3b916f45  fonts/monolisa/MonoLisa-ThinItalic.ttf
          bbb27720891f667d0c2c563a4a9a4c4e1bbf762e  lib/libpixbufloader-svg.so
          EOF

          while read -r expected path; do
            actual="$(git hash-object "$path")"
            test "$actual" = "$expected"
          done < /tmp/expected-blobs.txt

          test "$(find . -type f | wc -l)" -eq 19

      - name: Commit share assets
        run: |
          set -euo pipefail
          rm -rf share
          mkdir -p share
          cp -a /tmp/myconty-share/. share/
          chmod 755 share/lib/libpixbufloader-svg.so

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add share
          git diff --cached --exit-code && exit 0
          git commit -m 'Migrate MyConty share assets'
          git push origin HEAD:master
